[package]
name = "herdr-companion"
version = "0.1.0"
description = "A lightweight Herdr status and navigation companion"
authors = ["Herdr Companion contributors"]
edition = "2021"

[lib]
name = "herdr_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
interprocess = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
